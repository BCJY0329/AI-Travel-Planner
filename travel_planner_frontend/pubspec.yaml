name: travel_planner_frontend
description: "Flutter frontend for the AI Travel Planner, featuring Lemon.ai chat assistant."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/lemon_avatar.png
    # Discover photos; see lib/config/discover_content.dart to swap them.
    - assets/images/photos/
  # Bundled OFL fonts. Discover: Poppins headings, platform-default body.
  # Flights/Hotels/Attractions/Itinerary: Unbounded headings, Outfit body,
  # Fredoka for Lemon's notes.
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-500.ttf
          weight: 500
        - asset: assets/fonts/Unbounded-600.ttf
          weight: 600
        - asset: assets/fonts/Unbounded-700.ttf
          weight: 700
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-400.ttf
          weight: 400
        - asset: assets/fonts/Outfit-500.ttf
          weight: 500
        - asset: assets/fonts/Outfit-600.ttf
          weight: 600
        - asset: assets/fonts/Outfit-700.ttf
          weight: 700
        - asset: assets/fonts/Outfit-800.ttf
          weight: 800
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-500.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-600.ttf
          weight: 600
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-500.ttf
          weight: 500
        - asset: assets/fonts/Poppins-600.ttf
          weight: 600
        - asset: assets/fonts/Poppins-700.ttf
          weight: 700
        - asset: assets/fonts/Poppins-800.ttf
          weight: 800
